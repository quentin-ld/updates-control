font-family-mono': '\"Menlo\", \"Consolas\", monaco, monospace',\n    '--wpds-typography-font-size-xs': '11px',\n    '--wpds-typography-font-size-sm': '12px',\n    '--wpds-typography-font-size-md': '13px',\n    '--wpds-typography-font-weight-default': '400',\n    '--wpds-typography-font-weight-emphasis': '600',\n}\n\n# 1) typo'd token names -> real names\nRENAMES = [\n    ('--wpds-color-fg-', '--wpds-color-foreground-'),\n    ('--wpds-color-bg-', '--wpds-color-background-'),\n    ('--wpds-typography-font-weight-regular', '--wpds-typography-font-weight-default'),\n    ('--wpds-typography-font-weight-medium', '--wpds-typography-font-weight-emphasis'),\n]\n\n# 2) wrong hand-written fallbacks -> official values\nWRONG = [\n    ('var(--wpds-dimension-gap-lg, 24px)', 'var(--wpds-dimension-gap-lg, 16px)'),\n    ('var(--wpds-dimension-gap-md, 16px)', 'var(--wpds-dimension-gap-md, 12px)'),\n    ('var(--wpds-dimension-gap-sm, 12px)', 'var(--wpds-dimension-gap-sm, 8px)'),\n    ('var(--wpds-dimension-gap-xs, 8px)', 'var(--wpds-dimension-gap-xs, 4px)'),\n    ('var(--wpds-color-stroke-surface-neutral-weak, #d6e2ed)', 'var(--wpds-color-stroke-surface-neutral-weak, #f0f0f0)'),\n]\n\n# 3) bare var(--wpds-x) -> var(--wpds-x, <fallback>)\nBARE = re.compile(r'var\\((--wpds-[a-z0-9-]+)\\)')\n\nfiles = glob.glob('assets/src/scss/**/*.scss', recursive=True)\ntotal_renamed = total_wrong = total_bare = 0\nmissing = set()\n\nfor path in sorted(files):\n    src = open(path).read()\n    orig = src\n    for old, new in RENAMES:\n        n = src.count(old)\n        if n:\n            src = src.replace(old, new)\n            total_renamed += n\n            print(f\"  rename {path}: {old} x{n}\")\n    for old, new in WRONG:\n        n = src.count(old)\n        if n:\n            src = src.replace(old, new)\n            total_wrong += n\n            print(f\"  wrongfb {path}: {old} x{n}\")\n    def add_fb(m):\n        token = m.group(1)\n        if token not in FALLBACKS:\n            missing.add(token)\n            return m.group(0)\n        return f'var({token}, {FALLBACKS[token]})'\n    src, n = BARE.subn(add_fb, src)\n    total_bare += n\n    if n:\n        print(f\"  bare {path}: +{n} fallbacks\")\n    if src != orig:\n        open(path, 'w').write(src)\n\nprint(f\"\\nTOTAL: renamed={total_renamed} wrong_fallbacks_fixed={total_wrong} bare_fallbacks_added={total_bare}\")\nif missing:\n    print(\"TOKENS WITHOUT FALLBACK (need map entries):\", sorted(missing))\nelse:\n    print(\"All bare var(--wpds-*) got a fallback.\")\nEOF", "Bash=cd \"/home/quentin/Local Sites/updatronix/app/public/wp-content/plugins/updatronix\" && echo \"=== bare var() remaining (should be empty) ===\" && grep -rno 'var(--wpds-[a-z0-9-]*)' assets/src/scss/ ; echo \"=== typo names remaining (should be empty) ===\" && grep -rn -- '--wpds-color-fg\\|--wpds-color-bg\\|font-weight-regular\\|font-weight-medium' assets/src/scss/ ; echo \"=== unknown token names vs token set ===\" && for t in $(grep -rho \"var(--wpds-[a-z0-9-]*\" assets/src/scss/ | sed 's/var(//' | sort -u); do if ! grep -q -- \"$t:\" node_modules/@wordpress/theme/prebuilt/css/design-tokens.css; then echo \"MISSING: $t\"; fi; done; echo \"=== done ===\"", "Bash=cd \"/home/quentin/Local Sites/updatronix/app/public/wp-content/plugins/updatronix\" && python3 - <<'EOF'\nimport re\ncss = open('assets/build/index.css').read()\n# Parse each var() with proper nesting: var(--token, fallback) where fallback may itself contain var()\n# Match plugin-owned rules only (contain 'updatronix' or the plugin's component classes)\n# Accurate: find var(--wpds-...) then check the matching closing paren, look for a top-level comma\ndef vars_in(s):\n    out=[]\n    for m in re.finditer(r'var\\(--wpds-', s):\n        start=m.end()-1  # at '('\n        depth=0\n        j=start\n        top_comma=False\n        for k in range(start, len(s)):\n            c=s[k]\n            if c=='(': depth+=1\n            elif c==')':\n                depth-=1\n                if depth==0:\n                    tok_full=s[start:k+1]\n                    out.append((tok_full, top_comma))\n                    break\n            elif c==',' and depth==1:\n                top_comma=True\n    return out\n\n# ensure our token declarations live in :root -> they resolve; so \"bare\" is only a problem\n# if token not defined. Confirm all plugin-owned bare-ish vars are actually defined in :root.\nvars_list=vars_in(css)\nbare_no_fb=[t for t,fb in vars_list if not fb]\nprint(\"total var(--wpds-...)\", len(vars_list))\nprint(\"true bare (no fallback)\", len(bare_no_fb))\nprint(sorted(set(bare_no_fb)))\n# check token definitions present in :root\nroot_defs=set(re.findall(r'--wpds-[a-z0-9-]+:', css.split(':root{',1)[1].split('}',1)[0]))\nmissing=[t for t in bare_no_fb if '__root__' and t.split(',')[0][4:] not in root_defs]\nprint(\"bare tokens NOT defined in :root:\", missing if missing else \"NONE\")\nEOF", "Bash=cd \"/home/quentin/Local Sites/updatronix/app/public/wp-content/plugins/updatronix\" && echo \"=== 1. no typo names in built CSS (expect empty) ===\" && (grep -o -- '--wpds-color-fg\\|--wpds-color-bg\\|font-weight-regular\\|font-weight-medium' assets/build/index.css | head || true) && echo \"=== 2. plugin selectors use renamed tokens WITH fallbacks ===\" && grep -oE 'updatronix-(header|panel|notes|settings|autoupdates)[^}]*var\\(--wpds-color-(foreground|background|stroke)[a-z0-9-]*(,)[^)]*\\)' assets/build/index.css | grep -E 'foreground|background' | sort -u | head -20 && echo \"=== 3. interactive brand token fallback chains to wp-admin-theme-color ===\" && grep -o 'var(--wpds-color-foreground-interactive-brand,[^)]*)' assets/build/index.css | head -3"]
